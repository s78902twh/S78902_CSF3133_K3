<h2>Registration Form</h2>
<form action="/submit_form.php" method="post">
    <label for="fname">First Name:</label><br>
    <input type="text" id="fname" name="firstname" required><br><br>

    <label for="lname">Last Name:</label><br>
    <input type="text" id="lname" name="lastname" required><br><br>

    <label for="gender">Gender:</label><br>
    <input type="radio" id="male" name="gender" value="male" required>
    <label for="male">Male</label><br>
    <input type="radio" id="female" name="gender" value="female" required>
    <label for="female">Female</label><br><br>

    <input type="submit" value="Register">
</form>

<form action="/submit_form.php" method="post">
    <label for="hobby">Select Your Hobbies:</label><br>
    <input type="checkbox" id="hobby1" name="hobby1" value="reading">
    <label for="hobby1">Reading</label><br>
    <input type="checkbox" id="hobby2" name="hobby2" value="Gaming" required>
    <label for="hobby2">Gaming</label><br><br>

    <label for="country">Choose a country:</label><br>
    <select id="country" name="country"><br><br>
        <option value="usa">USA</option>
        <option value="canada">Canada</option>
        <option value="uk">UK</option>
    </select><br><br>

    <input type="submit" value="Submit">
</form>
